<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f3bdbb" />
  <meta name="robots" content="noindex" />

  <title>CandySky — магазин в разработке</title>

  <!-- Отдельная страница-заглушка, НЕ часть Mini App: не читает API, не
       трогает localStorage приложения, ни от чего в проекте не зависит.
       Оформление скопировано с экрана загрузки (.splash-screen)
       candysky-app.html: тот же фон, тот же вращающийся блик, тот же логотип. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Тема — синхронно и ДО отрисовки, чтобы не мигало светлой.
       Авто: тема Telegram, вне Telegram — тема системы. -->
  <script>
    (function () {
      var tgTheme =
        window.Telegram && window.Telegram.WebApp
          ? window.Telegram.WebApp.colorScheme
          : null;
      var systemDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      var resolved = tgTheme ? tgTheme : systemDark ? "dark" : "light";
      document.documentElement.dataset.theme =
        resolved === "dark" ? "dark" : "light";
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --pink: #f3bdbb;
      --pink-dark: #c97878;
      --mint: #a2dacd;
      --mint-dark: #438f80;

      --page-bg: #fffaf8;
      --text: #20252a;
      --muted: #68737a;
    }

    [data-theme="dark"] {
      --page-bg: #15181b;
      --text: #ffffff;
      --muted: #c0c8cc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      background: var(--page-bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    /* Копия .splash-screen из candysky-app.html (светлая и тёмная темы). */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding:
        max(24px, env(safe-area-inset-top))
        24px
        max(24px, env(safe-area-inset-bottom));
      text-align: center;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(243, 189, 187, 0.78),
          transparent 55%
        ),
        radial-gradient(
          circle at 80% 78%,
          rgba(162, 218, 205, 0.78),
          transparent 55%
        ),
        var(--page-bg);
    }

    [data-theme="dark"] .screen {
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(243, 189, 187, 0.55),
          transparent 55%
        ),
        radial-gradient(
          circle at 80% 78%,
          rgba(162, 218, 205, 0.55),
          transparent 55%
        ),
        var(--page-bg);
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
    }

    /* Вращающееся диагональное блик-пятно (розовый top-left → мятный
       bottom-right) — как у .splash-logo-wrap::before. */
    .logo-wrap::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      max-width: 90vw;
      max-height: 90vw;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        rgba(243, 189, 187, 0.85) 0%,
        rgba(243, 189, 187, 0.7) 45%,
        rgba(162, 218, 205, 0.7) 55%,
        rgba(162, 218, 205, 0.85) 100%
      );
      filter: blur(26px);
      z-index: 0;
      animation: glow-rotate 2.5s linear infinite;
    }

    [data-theme="dark"] .logo-wrap::before {
      background: linear-gradient(
        135deg,
        rgba(243, 189, 187, 0.68) 0%,
        rgba(243, 189, 187, 0.55) 45%,
        rgba(162, 218, 205, 0.55) 55%,
        rgba(162, 218, 205, 0.68) 100%
      );
    }

    @keyframes glow-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .logo {
      position: relative;
      z-index: 1;
      width: 236px;
      height: 236px;
      max-width: 62vw;
      max-height: 62vw;
      display: block;
    }

    .title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 2px;
    }

    .dots span {
      animation: dot-bounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dot-bounce {
      0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    .subtitle {
      position: relative;
      z-index: 1;
      margin: -10px 0 0;
      max-width: 300px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap::before,
      .dots span {
        animation: none;
      }
    }
  </style>
</head>
